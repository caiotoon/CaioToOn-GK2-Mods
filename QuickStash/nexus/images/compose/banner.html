<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b0908}
.art{position:absolute;inset:0;background:url(../src/header-art.png) center/cover no-repeat}
.shade{position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(8,6,5,.92) 0%,rgba(8,6,5,.78) 24%,rgba(8,6,5,.35) 40%,rgba(8,6,5,0) 54%),
 linear-gradient(0deg,rgba(8,6,5,.55) 0%,rgba(8,6,5,0) 22%)}
.text{position:absolute;left:100px;top:50%;transform:translateY(-50%);width:700px;color:#f6ead0;font-family:Georgia,serif}
.kicker{font:600 26px Bahnschrift,'Segoe UI',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#f0a030;margin-bottom:22px;white-space:nowrap}
h1{font-size:118px;line-height:1;margin:0 0 30px;font-weight:700;letter-spacing:-.01em;text-shadow:0 4px 0 #1a120c,0 10px 40px rgba(0,0,0,.8)}
p{font:400 36px/1.4 Bahnschrift,'Segoe UI',sans-serif;color:#dccba3;margin:0 0 40px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.row{display:flex;align-items:center;gap:22px;font:400 32px Bahnschrift,'Segoe UI',sans-serif;color:#c9b993}
.key{display:inline-block;min-width:74px;padding:8px 22px 14px;border-radius:14px;background:#2a2019;border:3px solid #8a6c42;border-bottom-width:10px;
 color:#f6ead0;font:700 52px Consolas,monospace;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.7)}
</style></head><body>
<div class="art"></div><div class="shade"></div>
<div class="text"><div class="kicker">Graveyard Keeper 2 mod</div><h1>QuickStash</h1>
<p>One key puts it all away.</p>
<div class="row"><span class="key">G</span><span>stash into every chest nearby</span></div></div>
</body></html>
